const SPR=new Map();
let KS=1,QUAL=1,fpsEma=0.016,slowT=0,AUTOLV=0;
// graphics: auto / high / bal / perf. perf renders at lower resolution, which is what actually helps slow laptops
function gfxLevel(){try{if(WATCH)return 2;const g=S.set.gfx||'auto';return g=='high'?0:g=='bal'?1:g=='perf'?2:AUTOLV}catch(e){return 0}}
function applyGfx(){const l=gfxLevel();QUAL=l<2?1:0;SPR.delete('vig0');SPR.delete('vig1');fit();fpsEma=0.016;slowT=0}
// Apple Watch (tiny touch screen, or ?watch=1 to test): levels fill the screen (cropped sides) and zoom in on the player,
// tap anywhere = jump, Digital Crown (page scroll) = move. Menus stay letterboxed so every button is on screen.
const WATCH=(()=>{const q=location.search;let w=false;try{if(/[?&]watch=0/.test(q)){localStorage.removeItem('hs_watch');return false}
  w=/[?&]watch=1/.test(q)||Math.min(screen.width,screen.height)<=260||Math.min(innerWidth,innerHeight)<=260&&(navigator.maxTouchPoints||0)>0||/watch/i.test(navigator.userAgent)||localStorage.getItem('hs_watch')=='1';
  if(w)localStorage.setItem('hs_watch','1')}catch(e){}return w})();
let FITC=0,CRD=0,CRT=-1e9;
// ?debug=1 shows what the device reports (screen size, Watch mode, scroll/wheel/touch event counts) to diagnose the Crown
const DBG=/[?&]debug=1/.test(location.search),DBN={scroll:0,wheel:0,touch:0,key:0};
if(DBG){addEventListener('scroll',()=>DBN.scroll++,{passive:true,capture:true});addEventListener('wheel',()=>DBN.wheel++,{passive:true});
 addEventListener('touchstart',()=>DBN.touch++,{passive:true,capture:true});addEventListener('keydown',()=>DBN.key++,true)}
function fit(){const d=Math.min(window.devicePixelRatio||1,[1.5,1,0.7][gfxLevel()]),s=(FITC?Math.max:Math.min)(innerWidth/VW,innerHeight/VH),cw=Math.floor(VW*s),ch=Math.floor(VH*s);cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.max(1,Math.floor(cw*d));cv.height=Math.max(1,Math.floor(ch*d));KS=cv.width/VW;
 if(WATCH)try{PB.x=FITC?Math.round(VW/2+innerWidth/2/s-30):VW-38}catch(e){}}
addEventListener('resize',fit);fit();
// Digital Crown: watchOS turns it into page scrolling, so give the page room to scroll, read which way it moved, and snap back
if(WATCH){try{const st=document.createElement('style');st.textContent='html,body{overflow-y:scroll!important;height:auto!important}canvas{position:fixed!important}';document.head.appendChild(st);
 const sp=document.createElement('div');sp.style.cssText='height:40000px;width:1px';document.body.appendChild(sp);const BASE=20000;setTimeout(()=>scrollTo(0,BASE),60);
 addEventListener('scroll',()=>{const d=scrollY-BASE;if(Math.abs(d)<2)return;CRD=d<0?1:-1;CRT=performance.now();scrollTo(0,BASE)},{passive:true});
 addEventListener('wheel',e=>{if(!e.deltaY)return;CRD=e.deltaY<0?1:-1;CRT=performance.now()},{passive:true})}catch(e){}}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>1-Math.pow(1-clamp(t,0,1),3);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmtT(t){if(!isFinite(t)||!t||t<=0)return'--:--';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function todaySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
// ---- daily refresh countdown (to next LOCAL midnight, matching todayStr/todaySeed) ----
function msToMidnight(){const d=new Date();const n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,0,0);return Math.max(0,n-d)}
function fmtCountdown(ms){if(!isFinite(ms)||ms<0)ms=0;const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
 if(h>0)return h+'h '+m+'m';if(m>0)return m+'m '+sc+'s';return sc+'s'}
// cached so hot draw loops don't rebuild the string every frame; recomputes once per real second
let CDT=-1,CDS='';
function cdStr(){const now=Math.floor(Date.now()/1000);if(now!=CDT){CDT=now;CDS=fmtCountdown(msToMidnight())}return CDS}

// ================= SAVE =================
const SKEY='hopscraper_save_v1';
function defSave(){return{lv:{},hard:{},course:{},dev:0,bank:0,earned:0,st:{jumps:0,deaths:0,time:0,clears:0},own:{c_red:1,h_none:1,t_none:1,t_dust:1},eq:{c:'c_red',h:'h_none',t:'t_dust'},ach:{},notes:{},tut:0,endBest:0,daily:{d:'',h:0},speedBest:0,hspeedBest:0,finale:0,set:{music:1,sfx:1,shake:1,touch:1,gfx:'auto'},
 coins:0,tix:0,tixDay:'',dtix:'',dbl:0,coinMed:{},club:0,clubDay:'',clubSpinWeek:-1,
 // Power Cards: consumable, Story Mode only (see "POWER CARDS" section). chaos = one-time unlock flag for Chaos Replay.
 cards:{shield:0,slowmo:0,xjump:0,magnet:0},chaos:0}}
let S=defSave();
function loadSave(){try{const r=localStorage.getItem(SKEY);if(r){const o=JSON.parse(r),d=defSave();S=Object.assign(d,o);for(const k of['st','own','eq','set','daily','cards'])S[k]=Object.assign(defSave()[k],o[k]||{});S.lv=o.lv||{};S.hard=o.hard||{};S.ach=o.ach||{};S.notes=o.notes||{};S.course=o.course||{};S.coinMed=o.coinMed||{};
 for(const k of['coins','tix','dbl','bank','club','chaos'])if(typeof S[k]!='number'||!isFinite(S[k]))S[k]=0;if(typeof S.clubSpinWeek!='number')S.clubSpinWeek=-1;if(typeof S.clubDay!='string')S.clubDay='';
 for(const k of['shield','slowmo','xjump','magnet'])if(typeof S.cards[k]!='number'||!isFinite(S.cards[k])||S.cards[k]<0)S.cards[k]=0;}}catch(e){}}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
// dev mode shows unlimited currency everywhere: use curTxt(S.coins) etc instead of ''+S.coins wherever a balance is drawn
function curTxt(n){return S.dev?'∞':''+n}
loadSave();applyGfx();
// coins: common currency. Coin Doubler and the Club each add +1x to coins earned in play (both = 3x). See coinMult().
function addCoins(n){n=Math.max(0,Math.round(n*coinMult()));S.coins+=n;return n}
// one free spin ticket per day
function dailyTix(){const d=todayStr();if(S.tixDay!=d){S.tixDay=d;S.tix++;save();toast('Free spin ready!','Your daily ticket is here','ach')}}
// hooks for the iOS wrapper (Game Center / App Store). On the web they do nothing.
function submitScore(board,value){try{if(window.HopNative&&HopNative.submitScore)HopNative.submitScore(board,value)}catch(e){}}
// update check: only when served over http(s). Looks for a newer BUILD in the page itself.
let UPD=0;const UPDRE=new RegExp("const BU"+"ILD='([^']*)'");
function chkUpd(){if(UPD||!/^https?:$/.test(location.protocol)||!window.fetch)return;try{fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t&&t.match(UPDRE);if(m&&m[1]&&m[1]!=BUILD)UPD=1}).catch(()=>{})}catch(e){}}
if(/^https?:$/.test(location.protocol)){setInterval(chkUpd,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkUpd()})}

// ================= AUDIO =================
let AC=null,master=null,musGain=null,sfxGain=null;
const mus={song:-1,want:null,step:0,next:0,timer:null};
let verb=null;
function impulse(sec,decay){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=26;comp.ratio.value=4;comp.attack.value=0.006;comp.release.value=0.22;
 master=AC.createGain();master.gain.value=0.7;master.connect(comp);comp.connect(AC.destination);
 verb=AC.createConvolver();verb.buffer=impulse(1.5,3.2);const vg=AC.createGain();vg.gain.value=0.5;verb.connect(vg);vg.connect(master);
 const mf=AC.createBiquadFilter();mf.type='lowpass';mf.frequency.value=2000;mf.Q.value=0.3;
 musGain=AC.createGain();musGain.connect(mf);mf.connect(master);
 const ms=AC.createGain();ms.gain.value=0.22;musGain.connect(ms);ms.connect(verb);
 const sf=AC.createBiquadFilter();sf.type='lowpass';sf.frequency.value=7000;sf.Q.value=0.2;
 sfxGain=AC.createGain();sfxGain.connect(sf);sf.connect(master);
 const ss=AC.createGain();ss.gain.value=0.16;sfxGain.connect(ss);ss.connect(verb);
 applyVol();if(mus.want!=null)musicPlay(mus.want)}catch(e){AC=null}}
// soft synth voice: filtered osc with pitch + amp envelope
function voice(o){if(!AC)return;const t=AC.currentTime+(o.d||0),len=o.len||0.2,pk=o.v==null?0.2:o.v;
 const osc=AC.createOscillator();osc.type=o.w||'sine';if(o.det)osc.detune.value=o.det;
 osc.frequency.setValueAtTime(o.f,t);
 if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(25,o.f2),t+(o.pt||len*0.8));
 const flt=AC.createBiquadFilter();flt.type='lowpass';flt.Q.value=o.q||0.6;
 flt.frequency.setValueAtTime(o.fc||9000,t);if(o.fc2)flt.frequency.exponentialRampToValueAtTime(Math.max(80,o.fc2),t+len);
 const g=AC.createGain();const a=o.a||0.01;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);
 g.gain.exponentialRampToValueAtTime(0.0007,t+len);
 osc.connect(flt);flt.connect(g);g.connect(o.dest||sfxGain);osc.start(t);osc.stop(t+len+0.06)}
function puff(o){if(!AC)return;const t=AC.currentTime+(o.d||0),len=o.len||0.1;
 const n=Math.max(1,Math.floor(AC.sampleRate*len)),b=AC.createBuffer(1,n,AC.sampleRate),arr=b.getChannelData(0);
 for(let i=0;i<n;i++)arr[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource();s.buffer=b;
 const f=AC.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.fc||1200,t);f.Q.value=o.q||1;
 if(o.fc2)f.frequency.exponentialRampToValueAtTime(Math.max(80,o.fc2),t+len);
 const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.v||0.1,t+0.008);g.gain.exponentialRampToValueAtTime(0.0006,t+len);
 s.connect(f);f.connect(g);g.connect(o.dest||sfxGain);s.start(t)}
function applyVol(){if(!AC)return;musGain.gain.value=S.set.music?0.16:0;sfxGain.gain.value=S.set.sfx?0.6:0}
function tone(f,d,type,v,slide,delay,dest,det){if(!AC)return;const t=AC.currentTime+(delay||0),vol=v||0.2;
 const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';if(det)o.detune.value=det;
 o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d*0.9);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
 o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+d+0.04)}
function chord(fs,d,type,v,delay,dest){fs.forEach((f,i)=>tone(f,d,type,v,0,(delay||0)+i*0.004,dest,i?7:-7))}
function noise(d,v,delay,hp,dest){if(!AC)return;const t=AC.currentTime+(delay||0);const len=Math.max(1,Math.floor(AC.sampleRate*d));const b=AC.createBuffer(1,len,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=AC.createGain();g.gain.value=v||0.2;s.connect(f);f.connect(g);g.connect(dest||sfxGain);s.start(t);}
// bell = two sines an octave+fifth apart, fast decay (clean, not buzzy)
function bell(f,len,v,d){voice({f,len,v,w:'sine',d,fc:6000});voice({f:f*2,len:len*0.6,v:v*0.35,w:'sine',d,fc:8000});voice({f:f*3,len:len*0.3,v:v*0.12,w:'sine',d})}
const SFX={
 jump(){voice({f:180,f2:420,len:0.17,v:0.2,w:'sine',pt:0.09,fc:2200});puff({fc:900,fc2:2600,len:0.1,v:0.035,q:0.8})},
 air(){voice({f:300,f2:640,len:0.14,v:0.15,w:'sine',pt:0.08,fc:2600});puff({fc:1600,fc2:4200,len:0.1,v:0.04,q:0.7})},
 wall(){voice({f:240,f2:430,len:0.13,v:0.14,w:'triangle',pt:0.07,fc:1800});puff({fc:1100,len:0.07,v:0.05})},
 land(){voice({f:150,f2:70,len:0.12,v:0.17,w:'sine',pt:0.07});puff({fc:500,fc2:200,len:0.09,v:0.05,q:0.6})},
 die(){voice({f:380,f2:70,len:0.55,v:0.2,w:'sine',pt:0.45,fc:1800,fc2:400});voice({f:190,f2:45,len:0.6,v:0.1,w:'triangle',pt:0.5,fc:900});puff({fc:800,fc2:150,len:0.3,v:0.07,q:0.5})},
 gem(){bell(1568,0.35,0.1);bell(2349,0.28,0.05,0.045)},
 key(){[784,1047,1319].forEach((f,i)=>bell(f,0.45,0.09,i*0.075))},
 check(){bell(880,0.4,0.1);bell(1319,0.5,0.07,0.1)},
 bounce(){voice({f:150,f2:520,len:0.28,v:0.2,w:'sine',pt:0.16,fc:2400});voice({f:300,f2:1040,len:0.2,v:0.05,w:'triangle',pt:0.14,d:0.01})},
 crumble(){puff({fc:700,fc2:220,len:0.25,v:0.07,q:0.5});voice({f:110,f2:60,len:0.2,v:0.07,w:'sine'})},
 click(){voice({f:900,len:0.05,v:0.06,w:'sine',fc:3000});puff({fc:2600,len:0.03,v:0.015})},
 move(){voice({f:620,len:0.035,v:0.035,w:'sine',fc:2400})},
 win(){[523,659,784,1047].forEach((f,i)=>bell(f,0.5,0.1,i*0.085));bell(1568,1.2,0.08,0.36)},
 star(i){const b=1047*Math.pow(1.26,i);bell(b,0.55,0.1);bell(b*1.5,0.4,0.05,0.05)},
 ach(){[659,880,1319].forEach((f,i)=>bell(f,0.6,0.09,i*0.09));bell(1760,1,0.05,0.3)},
 buy(){bell(880,0.3,0.09);bell(1319,0.45,0.07,0.08)},
 coin(){bell(1976,0.16,0.07);bell(2637,0.3,0.06,0.055)},
 tick(){voice({f:1500,len:0.035,v:0.05,w:'triangle',fc:4200})},
 no(){voice({f:220,f2:150,len:0.22,v:0.12,w:'triangle',fc:1200})},
 boom(){voice({f:120,f2:40,len:0.6,v:0.22,w:'sine',pt:0.35});puff({fc:400,fc2:90,len:0.5,v:0.09,q:0.4})}
};
function sfx(n,a){if(!AC||!S.set.sfx)return;try{SFX[n](a)}catch(e){}}
const SONGS=[
 {bpm:108,root:45,prog:[0,5,3,7],bass:[0,-1,0,-1,7,-1,0,-1,0,-1,0,-1,7,-1,5,-1],lead:[12,-1,16,-1,19,-1,16,-1,24,-1,19,-1,16,-1,-1,-1],hat:1},
 {bpm:126,root:48,prog:[0,5,7,5],bass:[0,-1,0,12,0,-1,7,-1,0,-1,0,12,5,-1,7,-1],lead:[12,16,19,16,24,19,16,12,14,17,21,17,24,21,17,14],hat:1},
 {bpm:134,root:45,prog:[0,3,5,3],bass:[0,0,12,0,0,0,10,0,0,0,12,0,7,7,5,3],lead:[12,-1,15,17,-1,15,12,-1,19,-1,17,15,-1,12,10,12],hat:2},
 {bpm:122,root:50,prog:[0,-2,-4,-5],bass:[0,-1,12,-1,0,-1,12,-1,0,-1,12,-1,0,-1,7,-1],lead:[24,19,15,12,24,19,15,12,22,19,15,10,22,19,15,10],hat:1},
 {bpm:142,root:43,prog:[0,1,0,-2],bass:[0,0,0,12,0,0,0,12,0,0,0,12,1,1,1,13],lead:[12,-1,-1,13,-1,-1,15,-1,12,-1,-1,10,-1,-1,7,-1],hat:2},
 {bpm:150,root:48,prog:[0,5,7,9],bass:[0,12,0,12,0,12,0,12,7,19,7,19,5,17,5,17],lead:[24,-1,28,-1,31,-1,28,31,36,-1,31,-1,28,-1,24,-1],hat:2},
 {bpm:140,root:47,prog:[0,3,5,7],bass:[0,-1,12,-1,0,-1,12,0,0,-1,12,-1,10,-1,7,-1],lead:[12,15,19,22,24,22,19,15,12,15,19,22,26,22,19,15],hat:2},
 {bpm:92,root:52,prog:[0,5,9,7],bass:[0,-1,-1,-1,7,-1,-1,-1,5,-1,-1,-1,7,-1,-1,-1],lead:[12,16,19,24,19,16,12,16,19,24,28,24,19,16,12,-1],hat:0},
];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musicPlay(i){mus.want=i;if(!AC)return;if(mus.song===i&&mus.timer)return;mus.song=i;mus.step=0;mus.next=AC.currentTime+0.08;if(!mus.timer)mus.timer=setInterval(musTick,25)}
function musTick(){if(!AC||mus.song<0)return;const s=SONGS[mus.song],st=60/s.bpm/4;if(mus.next<AC.currentTime-0.5)mus.next=AC.currentTime+0.05;while(mus.next<AC.currentTime+0.15){const i=mus.step%16,tr=s.prog[Math.floor(mus.step/16)%4],dl=mus.next-AC.currentTime;const b=s.bass[i];if(b>=0)voice({f:mtof(s.root+b+tr),len:st*1.7,v:0.26,w:'sine',a:0.03,fc:900,dest:musGain,d:dl});
 const l=s.lead[i];if(l>=0){const f=mtof(s.root+12+l+tr);voice({f,len:st*1.1,v:0.075,w:'triangle',a:0.015,fc:3200,fc2:900,dest:musGain,d:dl});voice({f,len:st*0.9,v:0.03,w:'sine',det:6,a:0.02,dest:musGain,d:dl})}
 if(s.hat&&i%4==2)puff({fc:7000,len:0.02,v:0.018,q:1.2,dest:musGain,d:dl});
 if(s.hat>1&&i%8==4)puff({fc:1800,fc2:700,len:0.06,v:0.05,q:0.7,dest:musGain,d:dl});
 if(s.hat&&i%8==0)voice({f:95,f2:52,len:0.16,v:0.22,w:'sine',pt:0.08,dest:musGain,d:dl});mus.next+=st;mus.step++}}

// ================= INPUT =================
const keys={},pressed={};
const KM={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',Space:'J',KeyZ:'J',KeyK:'J',KeyJ:'J',Enter:'OK',NumpadEnter:'OK',Escape:'ESC',KeyP:'ESC',KeyR:'RST',KeyM:'MUTE',Backspace:'ESC'};
let typedDigit=null,typedDel=false,lastTouch=0;
addEventListener('keydown',e=>{audioInit();const k=KM[e.code];if(k){if(!keys[k])pressed[k]=true;keys[k]=true;e.preventDefault()}
 if(!e.repeat&&/^(Digit|Numpad)[0-9]$/.test(e.code))typedDigit=e.code.slice(-1);
 if(!e.repeat&&e.code=='Backspace')typedDel=true;
 if(e.code=='Backquote')pressed.DEV=true;
 pressed.ANY=true});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){keys[k]=false;e.preventDefault()}});

// ================= TOUCH (mobile mode) =================
// left side: floating joystick where you touch, follows your thumb. right side: tap to jump (hold = higher).
// Every touch event rebuilds state from the browser's real list of fingers, so a lost "finger up" can never leave you stuck.
const PB={x:VW-38,y:84,r:22},STR=62,DZ=14;
const tp=new Map();let STK=null,uiTouch=null,tapBlock=0,noteSwipe=null;
function touchOn(){return !!S.set.touch}
function tpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH}}
function playing(){return SCR===SCREENS.play&&G&&G.player&&!G.won}
function tReset(){tp.clear();STK=null;uiTouch=null;for(const k of['L','R','D','J'])keys[k]=false}
function tsync(){let L=false,R=false,D=false,J=false;
 for(const v of tp.values())if(v=='jump')J=true;
 if(STK){const dx=STK.kx-STK.bx,dy=STK.ky-STK.by;if(dx<-DZ)L=true;if(dx>DZ)R=true;if(dy>STR*0.55&&dy>Math.abs(dx))D=true}
 for(const[k,v]of[['L',L],['R',R],['D',D],['J',J]]){if(v&&!keys[k])pressed[k]=true;keys[k]=v}}
function tReconcile(list){const live=new Set();for(let i=0;i<list.length;i++)live.add(list[i].identifier);
 for(const id of[...tp.keys()])if(!live.has(id))tp.delete(id);if(STK&&!live.has(STK.id))STK=null;if(uiTouch&&!live.has(uiTouch.id))uiTouch=null;if(noteSwipe&&!live.has(noteSwipe.id))noteSwipe=null}
cv.addEventListener('touchstart',e=>{e.preventDefault();lastTouch=performance.now();audioInit();tReconcile(e.touches);
 for(const t of e.changedTouches){const p=tpos(t);
  if(touchOn()&&playing()){
   // a note popup eats its own touches first: tap the X, or swipe it away like a notification
   if(G.noteShow&&noteXHit(p.x,p.y)){G.noteShow=null;continue}
   if(G.noteShow&&!noteSwipe&&noteBodyHit(p.x,p.y)){noteSwipe={id:t.identifier,y0:p.y,dy:0};continue}
   if(Math.hypot(p.x-PB.x,p.y-PB.y)<PB.r*1.7){pressed.ESC=true;continue}
   let hitCard=false;for(const cs of cardSlots())if(Math.hypot(p.x-cs.x,p.y-cs.y)<cs.r*1.6){useCard(cs.type);hitCard=true;break}
   if(hitCard)continue;
   if(!WATCH&&p.x<VW*0.45&&!STK){STK={id:t.identifier,bx:p.x,by:p.y,kx:p.x,ky:p.y};tp.set(t.identifier,'stick')}else tp.set(t.identifier,'jump')}
  else if(!uiTouch){uiTouch={id:t.identifier,x:p.x,y:p.y,moved:false};mouse.x=p.x;mouse.y=p.y;mouse.moved=true}}
 tsync()},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();lastTouch=performance.now();tReconcile(e.touches);
 for(const t of e.changedTouches){const p=tpos(t);
  if(STK&&STK.id===t.identifier){STK.kx=p.x;STK.ky=p.y;const dx=p.x-STK.bx,dy=p.y-STK.by,d=Math.hypot(dx,dy);if(d>STR){STK.bx=p.x-dx/d*STR;STK.by=p.y-dy/d*STR}}
  if(noteSwipe&&noteSwipe.id===t.identifier)noteSwipe.dy=p.y-noteSwipe.y0;
  if(uiTouch&&uiTouch.id===t.identifier&&Math.hypot(p.x-uiTouch.x,p.y-uiTouch.y)>22)uiTouch.moved=true}
 tsync()},{passive:false});
function tEnd(e){e.preventDefault();lastTouch=performance.now();
 for(const t of e.changedTouches){
  if(noteSwipe&&noteSwipe.id===t.identifier){if(noteSwipe.dy<-70)G.noteShow=null;noteSwipe=null}
  if(uiTouch&&uiTouch.id===t.identifier){const p=tpos(t);
  // menus fire on finger UP, only if the finger stayed put and the screen didn't just change
  if(e.type=='touchend'&&!uiTouch.moved&&performance.now()>tapBlock){mouse.x=p.x;mouse.y=p.y;mouse.click=true;pressed.ANY=true}uiTouch=null}}
 tReconcile(e.touches);tsync()}
cv.addEventListener('touchend',tEnd,{passive:false});cv.addEventListener('touchcancel',tEnd,{passive:false});
addEventListener('blur',tReset);document.addEventListener('visibilitychange',()=>{if(document.hidden)tReset()});addEventListener('pagehide',tReset);
function drawTouch(){ctx.save();
 if(STK){ctx.globalAlpha=0.22;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(STK.bx,STK.by,STR,0,7);ctx.fill();
  ctx.globalAlpha=0.5;ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(STK.bx,STK.by,STR,0,7);ctx.stroke();
  const dx=STK.kx-STK.bx,dy=STK.ky-STK.by,d=Math.hypot(dx,dy),k=d>STR?STR/d:1;
  ctx.globalAlpha=0.75;ctx.beginPath();ctx.arc(STK.bx+dx*k,STK.by+dy*k,26,0,7);ctx.fill()}
 else if(G&&G.mode=='story'&&G.idx==0&&G.t<7){ctx.globalAlpha=0.16*clamp(7-G.t,0,1);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(130,430,STR,0,7);ctx.fill();ctx.globalAlpha=0.4*clamp(7-G.t,0,1);txt('drag to move',130,430,15,'#ffffff','center',false);txt('tap to jump',VW-150,430,15,'#ffffff','center',false)}
 ctx.globalAlpha=0.45;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(PB.x,PB.y,PB.r,0,7);ctx.fill();
 ctx.globalAlpha=0.9;ctx.fillStyle='#1d1a2e';ctx.fillRect(PB.x-7,PB.y-8,5,16);ctx.fillRect(PB.x+2,PB.y-8,5,16);ctx.restore()}

function starsOf(i){const r=S.lv[i];if(!r||!r.done)return[0,0,0];const d=LEVELS[i];return[1,d.g.every((_,k)=>r.g&&r.g[k])?1:0,r.t&&r.t<=d.t?1:0]}
function totalStars(){let n=0;for(let i=0;i<LEVELS.length;i++)n+=starsOf(i).reduce((a,b)=>a+b,0);return n}
function unlocked(i,mode){if(S.dev)return true;if(mode=='hard')return !!S.finale&&(i==0||!!(S.hard[i-1]&&S.hard[i-1].done));const pv=prevOf(i);return i==0||pv<0||!!(S.lv[pv]&&S.lv[pv].done)}
function worldDone(w){return !!S.dev||!!(S.lv[w*8+7]&&S.lv[w*8+7].done)}
function grant(id){if(S.ach[id])return;S.ach[id]=1;S.tix++;const a=ACH.find(a=>a.id==id);const its=ITEMS.filter(it=>it.ach==id);its.forEach(it=>S.own[it.id]=1);
 toast(a.n+'  +1 ticket',its.length?'Unlocked: '+its.map(i=>i.n).join(', '):a.d,'ach');sfx('ach');save()}
function checkAch(){if(S.st.jumps>=500)grant('fly500');if(S.st.jumps>=5000)grant('fly5k');if(S.st.deaths>=100)grant('die100');if(S.st.deaths>=500)grant('die500');
 if(S.earned>=50)grant('gem50');if(S.earned>=150)grant('gem150');
 let par=0,all=true;for(let i=0;i<LEVELS.length;i++){const s=starsOf(i);if(s[2])par++;if(!(s[0]&&s[1]&&s[2]))all=false}if(par>=10)grant('speedy');if(all)grant('perfect');
 for(let w=0;w<4;w++){let ok=true;for(let i=w*8;i<w*8+8;i++){const s=starsOf(i);if(!(s[0]&&s[1]&&s[2]))ok=false}if(ok)grant('allw')}
 let h=true;for(let i=0;i<NL;i++)if(!(S.hard[i]&&S.hard[i].done))h=false;if(h)grant('nightmare')}
function levelWon(){const i=G.idx,def=LEVELS[i];
 const res={i,mode:G.mode,time:G.time,deaths:G.deaths,jumps:G.jumps,par:def.t,gems:G.L.gems.map(g=>g.got),gt:def.g.length,newGems:0,stars:[1,0,0],newStars:[0,0,0],bestT:false,first:false,worldClear:-1,finaleFirst:false,bonus:0,reward:null};
 S.st.clears++;
 if(G.mode=='story'){const rec=S.lv[i]||(S.lv[i]={done:0,g:[],t:0,fl:0});const old=starsOf(i);res.first=!rec.done;
  G.L.gems.forEach(gm=>{if(gm.got&&!rec.g[gm.i]){rec.g[gm.i]=1;res.newGems++}});
  if(!rec.t||G.time<rec.t){res.bestT=!!rec.t;rec.t=G.time}
  if(G.deaths==0){rec.fl=1;grant('flaw')}
  rec.done=1;const now=starsOf(i);res.stars=now;res.newStars=now.map((s,k)=>s&&!old[k]?1:0);
  res.bonus=(res.newStars[1]+res.newStars[2])*2;S.bank+=res.newGems+res.bonus;S.earned+=res.newGems+res.bonus;
  if(i==0)grant('first');
  if(res.first&&i==LEVELS.length-1)grant('rocket');
  if(res.first&&i<NL-1&&i%8==7){res.worldClear=Math.floor(i/8);grant('w'+(res.worldClear+1));const it=WREW[res.worldClear];if(!S.own[it]){S.own[it]=1;res.reward=it}}
  if(i==NL-1&&!S.finale){res.finaleFirst=true;S.finale=1;grant('top');}
  if(res.bestT||res.first){const w=i>=NL?4:i<NL-1?Math.floor(i/8):-1,wt=worldTime(w);if(wt)submitScore('world'+(w+1),wt)}submitScore('stars',totalStars())}
 else if(G.mode=='hard'){const rec=S.hard[i]||(S.hard[i]={done:0,t:0});res.first=!rec.done;if(!rec.t||G.time<rec.t){res.bestT=!!rec.t;rec.t=G.time}
  if(res.first){S.bank+=3;S.earned+=3;res.bonus=3}rec.done=1;if(i==NL-1)grant('hard')}
 // coins: pickups + clear reward + par + no falls
 const hardM=G.mode=='hard';res.coinPick=G.coinsRun;res.coinClear=hardM?(res.first?25:5):(res.first?10:5);res.coinPar=G.time<=def.t?5:0;res.coinFlaw=G.deaths==0?5:0;
 res.coins=addCoins(res.coinPick+res.coinClear+res.coinPar+res.coinFlaw);
 checkAch();save();return res}

 if(r.daily){const d=G.dailyDay||todayStr();r.rollover=d!=todayStr();if(S.daily.d!=d)S.daily={d,h:0};if(r.h>S.daily.h){S.daily.h=r.h;r.best=true}r.bestV=S.daily.h;if(S.dtix!=d){S.dtix=d;S.tix++;r.tix=1}submitScore('daily',S.daily.h)}

 if(G.mode=='tut'){const first=!S.tut;S.tut=1;if(first){S.bank+=5;S.earned+=5}save();toast('Tutorial complete!',first?'+5 gems. Now go climb.':'Nice refresher.','ach');return go('modes')}
 if(G.mode=='course'){const i=G.idx,rec=S.course[i]||(S.course[i]={t:0});const r={i,t:G.time,deaths:G.deaths,best:false,gems:G.gemsRun};
  if(!rec.t||G.time<rec.t){rec.t=G.time;r.best=true;submitScore('course'+i,rec.t)}
  S.bank+=G.gemsRun;S.earned+=G.gemsRun;r.medal=medalOf(i,rec.t);
  // medal coins: bronze 10 / silver 20 / gold 30, each tier paid once
  const had=S.coinMed[i]==null?-1:S.coinMed[i];let mc=0;for(let m=had+1;m<=r.medal;m++)mc+=[10,20,30][m];if(r.medal>had)S.coinMed[i]=r.medal;r.coins=addCoins(mc);

 if(G.mode=='speed'||G.mode=='hspeed'){const hs=G.mode=='hspeed';SPD.total+=G.time;SPD.deaths+=G.deaths;SPD.coins=(SPD.coins||0)+addCoins(G.coinsRun);save();const n=hs?(G.idx+1<NL?G.idx+1:-1):nextOf(G.idx);if(n>=0)return startLevel(n,G.mode);
