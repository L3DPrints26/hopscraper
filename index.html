<script>
'use strict';
const BUILD='20260923-221810'; // change this on every upload so open copies show "Update ready"
// Where the Settings > Send Feedback button goes. Leave FEEDBACK_URL empty to email FEEDBACK_EMAIL instead;
// paste a Google Form link into FEEDBACK_URL and it wins. Either way the build number rides along (see openFeedback).
const FEEDBACK_URL='';  // Google Form URL - set before release
const FEEDBACK_EMAIL='gamercrafter1510@gmail.com';
// ================= CORE =================
const TS=24,VW=960,VH=540,DT=1/120;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
function withCtx(g,fn){const o=ctx;ctx=g;try{fn()}finally{ctx=o}}
const SPR=new Map();
let KS=1,QUAL=1,fpsEma=0.016,slowT=0,AUTOLV=0;
// graphics: auto / high / bal / perf. perf renders at lower resolution, which is what actually helps slow laptops
function gfxLevel(){try{const g=S.set.gfx||'auto';return g=='high'?0:g=='bal'?1:g=='perf'?2:AUTOLV}catch(e){return 0}}
function applyGfx(){const l=gfxLevel();QUAL=l<2?1:0;SPR.delete('vig0');SPR.delete('vig1');fit();fpsEma=0.016;slowT=0}
function fit(){const d=Math.min(window.devicePixelRatio||1,[1.5,1,0.7][gfxLevel()]),s=Math.min(innerWidth/VW,innerHeight/VH),cw=Math.floor(VW*s),ch=Math.floor(VH*s);cv.style.width=cw+'px';cv.style.height=ch+'px';cv.width=Math.max(1,Math.floor(cw*d));cv.height=Math.max(1,Math.floor(ch*d));KS=cv.width/VW;}
addEventListener('resize',fit);fit();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>1-Math.pow(1-clamp(t,0,1),3);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmtT(t){if(!isFinite(t)||!t||t<=0)return'--:--';const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)}
// daily day boundary is UTC so every player gets the same Daily Climb tower on the same day
function todayStr(){const d=new Date();return d.getUTCFullYear()+'-'+(d.getUTCMonth()+1)+'-'+d.getUTCDate()}
function todaySeed(){const d=new Date();return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate()}
// ---- daily refresh countdown (to next UTC midnight, matching todayStr/todaySeed) ----
function msToMidnight(){const d=new Date();const n=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+1,0,0,0,0);return Math.max(0,n-d.getTime())}
function fmtCountdown(ms){if(!isFinite(ms)||ms<0)ms=0;const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
 if(h>0)return h+'h '+m+'m';if(m>0)return m+'m '+sc+'s';return sc+'s'}
// cached so hot draw loops don't rebuild the string every frame; recomputes once per real second
let CDT=-1,CDS='';
function cdStr(){const now=Math.floor(Date.now()/1000);if(now!=CDT){CDT=now;CDS=fmtCountdown(msToMidnight())}return CDS}

// ================= SAVE =================
const SKEY='hopscraper_save_v1';
// default control scheme: touch only on real touch-first devices (existing saves keep their own setting)
// "Reduce Flashing & Motion" setting defaults to the system's reduced-motion preference (see RM())
function prefersRM(){try{return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?1:0}catch(e){return 0}}
function RM(){try{return !!S.set.rm}catch(e){return false}}
function defSave(){return{lv:{},hard:{},course:{},dev:0,bank:0,earned:0,st:{jumps:0,deaths:0,time:0,clears:0},own:{c_red:1,h_none:1,t_none:1,t_dust:1},eq:{c:'c_red',h:'h_none',t:'t_dust'},ach:{},notes:{},tut:0,endBest:0,daily:{d:'',h:0,gp:0},speedBest:0,hspeedBest:0,finale:0,set:{music:1,sfx:1,shake:1,gfx:'auto',rm:prefersRM()},
 // ver = save format version. tixDay/dtix/clubDay are day numbers (todaySeed-style) and clubMonth a month number, so a
 // clock set backwards grants nothing. clubExp = Club expiry (ms, 0 = no expiry known). txDone = App Store transactions
 // already delivered, iap = one-time products owned (both survive Reset Save, see resetSave()).
 // pw = Premium Wheel pity counter (spins since the last jackpot, see PW_PITY/pwPick). tixBuyDay/tixBuy = today's
 // coins-for-tickets exchange count (see buyTix); tixBuyDay is a day number too, so the clock rule above covers it.
 // spun = has the player ever spent a free Prize Wheel ticket. The paid Premium Wheel stays hidden until then.
 // cardTip = the one-time "Power Card ready" explainer has been shown (see startLevel)
 ver:2,coins:0,tix:0,tixDay:0,dtix:0,spun:0,cardTip:0,dbl:0,coinMed:{},club:0,clubExp:0,clubDay:0,clubMonth:-1,clubSpinWeek:-1,txDone:{},iap:{},pw:0,tixBuyDay:0,tixBuy:0,
 // Power Cards: consumable, Story Mode only (see "POWER CARDS" section). chaos = one-time unlock flag for Chaos Replay.
 // goldrush is a Gold World bundle exclusive: see "GOLD RUSH" section for its spawn-in-coins-then-carry-across-levels behavior.
 cards:{shield:0,slowmo:0,xjump:0,magnet:0,goldrush:0},chaos:0,
 // World 6 (Low-G Zone): a PAID bonus world, gated by this purchase flag alone - never by clearing World 5/THE TOP. See unlocked().
 world6:0,
 // World 7 (Gilded Vale): same deal as World 6 above - PAID bonus, gated by this flag alone. See unlocked()/PRODUCTS goldworldbundle.
 goldworld:0,
 // World 8 (Monster Woods): same deal as World 6 above - PAID bonus, gated by this flag alone. See unlocked()/PRODUCTS monsterworldbundle.
 monsterworld:0}}
let S=defSave();
// 'y-m-d' strings (old saves) or numbers -> y*10000+m*100+d, comparable with todaySeed()
function dayNum(v){if(typeof v=='number'&&isFinite(v))return v;if(typeof v=='string'){const p=v.split('-').map(Number);if(p.length==3&&p.every(isFinite))return p[0]*10000+p[1]*100+p[2]}return 0}
// day number -> UTC ms, so two day numbers can be subtracted into a real day count (calendar-correct across months/years)
function dayMs(v){const n=dayNum(v);if(!n)return 0;return Date.UTC(Math.floor(n/10000),Math.floor(n/100)%100-1,n%100)}
// how many daily payouts a return after `last` is owed. Never more than DAILY_CATCHUP, never less than 1, and callers
// only ever reach it when today > last, so a clock set backwards still pays nothing (see dailyTix/clubDaily).
const DAILY_CATCHUP=3;
function daysOwed(last,now){const a=dayMs(last),b=dayMs(now);if(!a||!b||b<=a)return 1;return Math.max(1,Math.min(DAILY_CATCHUP,Math.round((b-a)/864e5)))}
const isObj=v=>!!v&&typeof v=='object'&&!Array.isArray(v);
// parse + repair a save string. Throws if it isn't a save at all (caller keeps a copy of it, never silently wipes it).
function parseSave(r){const o=JSON.parse(r);if(!isObj(o))throw new Error('bad save');const d=defSave(),s=Object.assign(d,o);
 for(const k of['st','own','eq','set','daily','cards'])s[k]=Object.assign(defSave()[k],isObj(o[k])?o[k]:{});
 for(const k of['lv','hard','ach','notes','course','coinMed','txDone','iap'])s[k]=isObj(o[k])?o[k]:{};
 for(const k of['coins','tix','dbl','bank','club','chaos','world6','goldworld','monsterworld','clubExp','earned','pw','tixBuy'])if(typeof s[k]!='number'||!isFinite(s[k]))s[k]=0;
 for(const k of['coins','tix','bank','pw','tixBuy'])if(s[k]<0)s[k]=0;
 if(typeof s.clubSpinWeek!='number'||!isFinite(s.clubSpinWeek))s.clubSpinWeek=-1;if(typeof s.clubMonth!='number'||!isFinite(s.clubMonth))s.clubMonth=-1;
 s.tixDay=dayNum(s.tixDay);s.dtix=dayNum(s.dtix);s.clubDay=dayNum(s.clubDay);s.tixBuyDay=dayNum(s.tixBuyDay);s.ver=2;
 delete s.set.touch; // dropped: the Computer/Mobile switch is gone and the layout is always mobile (see touchOn)
 for(const k of['shield','slowmo','xjump','magnet','goldrush'])if(typeof s.cards[k]!='number'||!isFinite(s.cards[k])||s.cards[k]<0)s.cards[k]=0;
 return s}
// STORE_OK: localStorage works at all. SAVE_LAST: the last good save string (becomes SKEY+'_bak' on the next write).
let STORE_OK=true,SAVE_LAST=null,SAVE_WARNED=false;const SAVE_MSG=[];
try{localStorage.setItem(SKEY+'_probe','1');localStorage.removeItem(SKEY+'_probe')}catch(e){STORE_OK=false}
function loadSave(){let r=null;try{r=localStorage.getItem(SKEY)}catch(e){STORE_OK=false;return}if(!r)return;
 try{S=parseSave(r);SAVE_LAST=r;return}catch(e){}
 // corrupt: keep the raw string under its own key (never overwritten), then fall back to the rolling backup
 try{localStorage.setItem(SKEY+'_corrupt_'+Date.now(),r)}catch(e){}
 let b=null;try{b=localStorage.getItem(SKEY+'_bak')}catch(e){}
 if(b){try{S=parseSave(b);SAVE_LAST=b;SAVE_MSG.push(['Save restored','Loaded your backup save']);return}catch(e){}}
 SAVE_MSG.push(['Save could not be read','A copy was kept. Starting fresh'])}
// save(): skipped when nothing changed; the previous good save is kept as SKEY+'_bak' before every write
function save(){let j;try{j=JSON.stringify(S)}catch(e){return}if(j===SAVE_LAST)return;
 try{if(SAVE_LAST)localStorage.setItem(SKEY+'_bak',SAVE_LAST);localStorage.setItem(SKEY,j);SAVE_LAST=j;STORE_OK=true}
 catch(e){STORE_OK=false;if(!SAVE_WARNED){SAVE_WARNED=true;try{toast('Progress not saved','Saving is blocked in this browser','info')}catch(e2){}}}}
function flushSaveMsgs(){while(SAVE_MSG.length){const m=SAVE_MSG.shift();toast(m[0],m[1],'info')}}
// save when the page is hidden/closed (phones kill background tabs without warning); reload if another tab saved
addEventListener('pagehide',()=>save());document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('storage',e=>{if(e.key!==SKEY||!e.newValue||e.newValue===SAVE_LAST)return;try{S=parseSave(e.newValue);SAVE_LAST=e.newValue;fixEq();applyVol()}catch(err){}});
// dev mode shows unlimited currency everywhere: use curTxt(S.coins) etc instead of ''+S.coins wherever a balance is drawn
function curTxt(n){return S.dev?'∞':fmtN(n)}
loadSave();applyGfx();
// coins: common currency. Coin Doubler and the Club each add +1x to coins earned in play (both = 3x). See coinMult().
function addCoins(n){n=Math.max(0,Math.round(n*coinMult()));S.coins+=n;return n}
// one free spin ticket per day, plus catch-up for up to DAILY_CATCHUP days actually missed (come back after a week
// and you get 3, not 1). Days are numbers and only ever move forward: winding the clock back (or forth and back
// again) grants nothing extra, and the catch-up count comes from the real gap between two day numbers.
function dailyTix(){const d=todaySeed(),last=dayNum(S.tixDay);if(d<=last)return;
 const n=last?daysOwed(last,d):1;S.tixDay=d;S.tix+=n;save();
 toast(n>1?'+'+n+' free spins!':'Free spin ready!',n>1?'Daily tickets for the days you missed':'Your daily ticket is here','ach')}
// coins -> Prize Wheel tickets. Coins are otherwise a shop-only currency, so this gives late-game coins somewhere to go.
// Capped per day (TIX_BUY_MAX) on the same forward-only day number as dailyTix, so a clock set back never refills it.
const TIX_COST=500,TIX_BUY_MAX=3;
function tixBuyUsed(){return todaySeed()>dayNum(S.tixBuyDay)?0:Math.max(0,S.tixBuy|0)}
function tixBuyLeft(){return Math.max(0,TIX_BUY_MAX-tixBuyUsed())}
function canBuyTix(){return tixBuyLeft()>0&&(!!S.dev||S.coins>=TIX_COST)}
function buyTix(){if(!canBuyTix())return false;const d=todaySeed();
 if(d>dayNum(S.tixBuyDay)){S.tixBuyDay=d;S.tixBuy=0}
 if(!S.dev)S.coins-=TIX_COST;S.tixBuy=(S.tixBuy|0)+1;S.tix++;save();return true}
// hooks for the iOS wrapper (Game Center / App Store). On the web they do nothing.
function submitScore(board,value){try{if(window.HopNative&&HopNative.submitScore)HopNative.submitScore(board,value)}catch(e){}}
// update check: only when served over http(s). Looks for a newer BUILD in the page itself.
let UPD=0;const UPDRE=new RegExp("const BU"+"ILD='([^']*)'");
function chkUpd(){if(UPD||!/^https?:$/.test(location.protocol)||!window.fetch)return;try{fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t&&t.match(UPDRE);if(m&&m[1]&&m[1]!=BUILD)UPD=1}).catch(()=>{})}catch(e){}}
if(/^https?:$/.test(location.protocol)){setInterval(chkUpd,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkUpd()})}

// ================= AUDIO =================
let AC=null,master=null,musGain=null,sfxGain=null;
const mus={song:-1,want:null,step:0,next:0,timer:null};
let verb=null;
function impulse(sec,decay){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
function audioInit(){if(AC){if(AC.state!=='running'&&!document.hidden)AC.resume().catch(()=>{});return}try{AC=new(window.AudioContext||window.webkitAudioContext)();
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=26;comp.ratio.value=4;comp.attack.value=0.006;comp.release.value=0.22;
 master=AC.createGain();master.gain.value=0.7;master.connect(comp);comp.connect(AC.destination);
 verb=AC.createConvolver();verb.buffer=impulse(1.5,3.2);const vg=AC.createGain();vg.gain.value=0.5;verb.connect(vg);vg.connect(master);
 const mf=AC.createBiquadFilter();mf.type='lowpass';mf.frequency.value=2000;mf.Q.value=0.3;
 musGain=AC.createGain();musGain.connect(mf);mf.connect(master);
 const ms=AC.createGain();ms.gain.value=0.22;musGain.connect(ms);ms.connect(verb);
 const sf=AC.createBiquadFilter();sf.type='lowpass';sf.frequency.value=7000;sf.Q.value=0.2;
 sfxGain=AC.createGain();sfxGain.connect(sf);sf.connect(master);
 const ss=AC.createGain();ss.gain.value=0.16;sfxGain.connect(ss);ss.connect(verb);
 applyVol();if(mus.want!=null)musicPlay(mus.want)}catch(e){AC=null}}
// suspend audio while the page is hidden, resume when it comes back
document.addEventListener('visibilitychange',()=>{if(!AC)return;try{(document.hidden?AC.suspend():AC.resume()).catch(()=>{})}catch(e){}});
// soft synth voice: filtered osc with pitch + amp envelope
function voice(o){if(!AC)return;const t=AC.currentTime+(o.d||0),len=o.len||0.2,pk=o.v==null?0.2:o.v;
 const osc=AC.createOscillator();osc.type=o.w||'sine';if(o.det)osc.detune.value=o.det;
 osc.frequency.setValueAtTime(o.f,t);
 if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(25,o.f2),t+(o.pt||len*0.8));
 const flt=AC.createBiquadFilter();flt.type='lowpass';flt.Q.value=o.q||0.6;
 flt.frequency.setValueAtTime(o.fc||9000,t);if(o.fc2)flt.frequency.exponentialRampToValueAtTime(Math.max(80,o.fc2),t+len);
 const g=AC.createGain();const a=o.a||0.01;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);
 g.gain.exponentialRampToValueAtTime(0.0007,t+len);
 osc.connect(flt);flt.connect(g);g.connect(o.dest||sfxGain);osc.start(t);osc.stop(t+len+0.06)}
function puff(o){if(!AC)return;const t=AC.currentTime+(o.d||0),len=o.len||0.1;
 const n=Math.max(1,Math.floor(AC.sampleRate*len)),b=AC.createBuffer(1,n,AC.sampleRate),arr=b.getChannelData(0);
 for(let i=0;i<n;i++)arr[i]=(Math.random()*2-1)*(1-i/n);
 const s=AC.createBufferSource();s.buffer=b;
 const f=AC.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.fc||1200,t);f.Q.value=o.q||1;
 if(o.fc2)f.frequency.exponentialRampToValueAtTime(Math.max(80,o.fc2),t+len);
 const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.v||0.1,t+0.008);g.gain.exponentialRampToValueAtTime(0.0006,t+len);
 s.connect(f);f.connect(g);g.connect(o.dest||sfxGain);s.start(t)}
function applyVol(){if(!AC)return;musGain.gain.value=S.set.music?0.16:0;sfxGain.gain.value=S.set.sfx?0.6:0}
function tone(f,d,type,v,slide,delay,dest,det){if(!AC)return;const t=AC.currentTime+(delay||0),vol=v||0.2;
 const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';if(det)o.detune.value=det;
 o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d*0.9);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0008,t+d);
 o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+d+0.04)}
function chord(fs,d,type,v,delay,dest){fs.forEach((f,i)=>tone(f,d,type,v,0,(delay||0)+i*0.004,dest,i?7:-7))}
function noise(d,v,delay,hp,dest){if(!AC)return;const t=AC.currentTime+(delay||0);const len=Math.max(1,Math.floor(AC.sampleRate*d));const b=AC.createBuffer(1,len,AC.sampleRate);const a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;const g=AC.createGain();g.gain.value=v||0.2;s.connect(f);f.connect(g);g.connect(dest||sfxGain);s.start(t);}
// bell = two sines an octave+fifth apart, fast decay (clean, not buzzy)
function bell(f,len,v,d){voice({f,len,v,w:'sine',d,fc:6000});voice({f:f*2,len:len*0.6,v:v*0.35,w:'sine',d,fc:8000});voice({f:f*3,len:len*0.3,v:v*0.12,w:'sine',d})}
const SFX={
 jump(){voice({f:180,f2:420,len:0.17,v:0.2,w:'sine',pt:0.09,fc:2200});puff({fc:900,fc2:2600,len:0.1,v:0.035,q:0.8})},
 air(){voice({f:300,f2:640,len:0.14,v:0.15,w:'sine',pt:0.08,fc:2600});puff({fc:1600,fc2:4200,len:0.1,v:0.04,q:0.7})},
 wall(){voice({f:240,f2:430,len:0.13,v:0.14,w:'triangle',pt:0.07,fc:1800});puff({fc:1100,len:0.07,v:0.05})},
 land(){voice({f:150,f2:70,len:0.12,v:0.17,w:'sine',pt:0.07});puff({fc:500,fc2:200,len:0.09,v:0.05,q:0.6})},
 die(){voice({f:380,f2:70,len:0.55,v:0.2,w:'sine',pt:0.45,fc:1800,fc2:400});voice({f:190,f2:45,len:0.6,v:0.1,w:'triangle',pt:0.5,fc:900});puff({fc:800,fc2:150,len:0.3,v:0.07,q:0.5})},
 gem(){bell(1568,0.35,0.1);bell(2349,0.28,0.05,0.045)},
 key(){[784,1047,1319].forEach((f,i)=>bell(f,0.45,0.09,i*0.075))},
 check(){bell(880,0.4,0.1);bell(1319,0.5,0.07,0.1)},
 bounce(){voice({f:150,f2:520,len:0.28,v:0.2,w:'sine',pt:0.16,fc:2400});voice({f:300,f2:1040,len:0.2,v:0.05,w:'triangle',pt:0.14,d:0.01})},
 crumble(){puff({fc:700,fc2:220,len:0.25,v:0.07,q:0.5});voice({f:110,f2:60,len:0.2,v:0.07,w:'sine'})},
 click(){voice({f:900,len:0.05,v:0.06,w:'sine',fc:3000});puff({fc:2600,len:0.03,v:0.015})},

function grantProduct(id,txId,isRestore){const pr=PRODUCTS.find(p=>p.id==id);if(!pr)return false;if(!isObj(S.txDone))S.txDone={};if(!isObj(S.iap))S.iap={};

 const entOnly=!!isRestore||(!!pr.once&&(!!S.iap[pr.id]||prodOwned(pr)));
 if(!entOnly){if(pr.gems)S.bank+=pr.gems;if(pr.coins)S.coins+=pr.coins;if(pr.cards)for(const k in pr.cards){const c=S.cards[k]||0;S.cards[k]=Math.max(c,Math.min(CARD_BUY_MAX,c+pr.cards[k]))}}

// DO bite in low gravity instead: pits floored with spikes (a missed landing kills rather than costing a hop), low crater
// roofs and hanging 'v' shards that clip the floaty arc short, vertical shafts taller than any jump chain, and hazards you
// have to time. Every level carries 3 gems off the direct line and 5 coins (see COINS, appended after World 5's).
// Difficulty climbs 6-1 -> 6-8 and the finale is meant to sit above World 4.
// ['vnt',tx,ty,dir,len,pow]: thruster vent - a gas plume venting 'U'p or 'D'own a `len`-tile column from the mouth tile.
// ['wel',tx,ty,r,pow]: gravity well - pulls the player toward its core inside radius r tiles. Harmless to touch.
// Both are pure functions of the player's position (see w6Forces): no timers, nothing to memorise, and the offline
// physics bot models them exactly. Vents are taught in 6-2, wells in 6-4, the 'D' down-draft variant in 6-7.
// ['ast',x,y,dir,per,kind,phase,mul]: asteroid spawner (see buildLevel/updAsteroids). dir 'D' falls (low-gravity aware), 'L'/'R' drifts
// straight across, 'DL'/'DR' drifts diagonally. kind 's' small/fast, 'b' big/slow+imposing. Periods are deliberately uneven
// per spawner (short=bursty, long=calm) so a level's debris reads as weather, not a metronome drip.
// ['rov',ax,ay,bx,by,sp,ph,per,mul,fph,wind]: moon-rover, patrols like a 'saw' and fires an AIMED laser bolt at the player
// when it has both range and line of sight (see updRovers/drawRoverStuff). per = seconds between shots, wind = length of
// the telegraph (default 0.6s: the turret locks its angle, draws a dashed sight line and charges a muzzle orb first).
// dips:[[x0,x1,y],...]: purely decorative crater-rim dressing (see drawCraterRims) over a floor span that sits one tile
// lower than its neighbors - the collision underneath is still a plain rectangular '#' block in r:.

function buildLevel(def,opt){opt=opt||{};
 const W=def.W||40,H=def.H||22,mir=!!opt.mirror;
 const g=[];for(let y=0;y<H;y++){const row=new Array(W).fill('.');if(y==0||y==H-1)row.fill('#');row[0]='#';row[W-1]='#';g.push(row)}

 // on the floor, so the whole level is genuinely flipped vertically here - geometry, spikes, items, movers and portals.

 const MX=x=>mir?W-1-x:x,MC=c=>!mir?c:c=='<'?'>':c=='>'?'<':c=='c'?'C':c=='C'?'c':c;
 for(const r of def.r){const[c,x,y,w,h]=r;for(let j=0;j<h;j++)for(let i=0;i<w;i++){const X=x+i,Y=y+j;if(X>0&&Y>0&&X<W-1&&Y<H-1)g[MY(Y)][MX(X)]=MV(MC(c))}}
 const L={def,W,H,g,mir,vf,gems:[],coins:[],checks:[],movers:[],cr:{},crl:[],lo:{},bt:{},key:null,rise:def.rise||null};
 L.start={x:MX(def.s[0]),y:MY(def.s[1])};L.exit={x:MX(def.e[0]),y:MY(def.e[1])};
 g[L.start.y][L.start.x]='.';if(L.exit.y>0&&L.exit.y<H)g[L.exit.y][L.exit.x]='.';
 (def.g||[]).forEach((p,i)=>{const X=MX(p[0]),Y=MY(p[1]);if(p[1]<=0||p[1]>=H-1)return;if(opt.skipBlocked&&g[Y][X]!='.')return;L.gems.push({x:X*TS+12,y:Y*TS+12,got:false,i})});
 (opt.coins||[]).forEach(p=>{if(p[1]>0&&p[1]<H-1)L.coins.push({x:MX(p[0])*TS+12,y:MY(p[1])*TS+12,got:false})});
 // World 7 (Gilded Vale) treasure chests: def.ch=[[x,y],...], y being the tile ABOVE the shelf it rests on so the chest
 // sits ON that shelf. Opening every chest in a level unlocks that level's gold vault doors - it sets the very same
 // G.keyGot flag L.key sets, so isSolid()/'D' rendering (and the physics bot's door model) need no special case. See step().

 if(!opt.noChecks)(def.k||[]).forEach(p=>L.checks.push({x:MX(p[0]),y:MY(p[1]),on:false}));
 if(def.key)L.key={x:MX(def.key[0])*TS+12,y:MY(def.key[1])*TS+12,got:false};

function circRect(cx,cy,r,x,y,w,h){const nx=clamp(cx,x,x+w),ny=clamp(cy,y,y+h);return(cx-nx)*(cx-nx)+(cy-ny)*(cy-ny)<r*r}

  // zombie "more natural" gait: warp the drive time with two small sine layers before feeding it through the same
  // ping-pong path saws use, instead of the saw's own clean cubic ease. Still a pure function of t (deterministic,
  // solver/mirror-safe) but the instantaneous speed staggers instead of gliding evenly - a lurch, not a glide.
  const tt=m.t=='zom'?t+0.22*Math.sin(t*1.3+m.ph*6.283)+0.09*Math.sin(t*3.7+m.ph*4.1):t;
  if(d<1||!m.sp){m.x=m.ax;m.y=m.ay}else{const s=((tt*m.sp+m.ph*d*2)%(2*d)+2*d)%(2*d);const u=s<d?s/d:2-s/d;const e=u*u*(3-2*u)*0.35+u*0.65;m.x=m.ax+dx*e;m.y=m.ay+dy*e;
   if(m.t=='zom')m.y+=Math.abs(Math.sin(tt*m.sp*0.12+m.ph*3))*2.4-1.2} // slight vertical bob/lurch on top of the path

 else if(m.t=='ogre'||m.t=='gho'){} // ogre: swing timing is a pure function of time (ogrePhase). ghost: see updGhosts.

function colX(L,p){const y0=Math.floor(p.y/TS),y1=Math.floor((p.y+p.h-0.01)/TS);
 if(p.vx>0){const tx=Math.floor((p.x+p.w-0.01)/TS);for(let ty=y0;ty<=y1;ty++)if(isSolid(L,tx,ty)){p.x=tx*TS-p.w;p.vx=0;break}}

function colY(L,p,oy,down,gs){gs=gs||1;p.onG=false;const x0=Math.floor(p.x/TS),x1=Math.floor((p.x+p.w-0.01)/TS);

 else{const ty=Math.floor(p.y/TS);for(let tx=x0;tx<=x1;tx++){const c=tAt(L,tx,ty);if(isSolid(L,tx,ty)||(gs<0&&c=='='&&!down&&oy>=(ty+1)*TS-0.5)){p.y=(ty+1)*TS;p.vy=0;if(gs<0)p.onG=true;break}}}}
function hurt(L,p){const hx=p.x+2.5,hy=p.y+2.5,hw=p.w-5,hh=p.h-5;
 const x0=Math.floor(hx/TS)-1,x1=Math.floor((hx+hw)/TS)+1,y0=Math.floor(hy/TS)-1,y1=Math.floor((hy+hh)/TS)+1;
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const c=tAt(L,tx,ty);let r=null;const px=tx*TS,py=ty*TS;
  switch(c){case'^':r=[px+3,py+12,18,12];break;case'v':r=[px+3,py,18,12];break;case'>':r=[px,py+3,12,18];break;case'<':r=[px+12,py+3,12,18];break;
   case'~':r=tAt(L,tx,ty-1)=='~'?[px,py,24,24]:[px,py+8,24,16];break;
   case'l':case'L':if(laserOn(c,L)){const o=L.lo[ty*L.W+tx];r=o=='v'?[px+8,py,8,24]:o=='h'?[px,py+8,24,8]:[px+6,py+6,12,12]}break}
  if(r&&hx<r[0]+r[2]&&hx+hw>r[0]&&hy<r[1]+r[3]&&hy+hh>r[1])return true}
 const cx=p.x+8,cy=p.y+8;
 for(const m of L.movers){if(m.t=='saw'){if(Math.abs(m.x-cx)<40&&Math.abs(m.y-cy)<40&&circRect(m.x,m.y,10.5,hx,hy,hw,hh))return true}

  // around the head - clearing it with a jump should feel like clearing it).
  else if(m.t=='zom'){if(Math.abs(m.x-cx)<40&&Math.abs(m.y-cy)<40&&hx<m.x+9&&hx+hw>m.x-9&&hy<m.y+11&&hy+hh>m.y-14)return true}
  else if(m.t=='rov'){if(Math.abs(m.x-cx)<32&&Math.abs(m.y-cy)<24&&circRect(m.x,m.y+2,11,hx,hy,hw,hh))return true}
  else if(m.t=='chan'){if(Math.abs(m.x-cx)<46&&Math.abs(m.y-cy)<46&&circRect(m.x,m.y+3*(m.vd||1),12,hx,hy,hw,hh))return true} // only the candle-ring bites, never the chain
  // Ogre: his BODY is never a hazard (you are meant to run past/under him) - only the club, and only mid-swing. The
  // hitbox is sampled along the exact club line drawOgreStuff draws, so what you see is what kills you.
  else if(m.t=='ogre'){const c=ogreClub(m,G.t*(G.spd||1));
   if(c.st.k=='swing'&&Math.abs(m.x-cx)<OG_TIP+30&&Math.abs(m.y+12+OG_PIV-cy)<OG_TIP+30)
    for(const q of OG_HIT)if(circRect(c.px+c.sx*q[0],c.py+c.sy*q[0],q[1],hx,hy,hw,hh))return true}

  else if(m.t=='gho'){if(m.sol&&Math.abs(m.x-cx)<30&&Math.abs(m.y-cy)<30&&circRect(m.x,m.y,11,hx,hy,hw,hh))return true}

 if(L.rise&&p.y+p.h-5>G.lavaY)return true;
 for(const r of L.rk||[])if(Math.abs(r.x-cx)<30&&Math.abs(r.y-cy)<30&&circRect(r.x,r.y,6.5,hx,hy,hw,hh)){r.life=0;return true}
 for(const a of L.ast||[])if(Math.abs(a.x-cx)<a.hr+40&&Math.abs(a.y-cy)<a.hr+40&&circRect(a.x,a.y,a.hr,hx,hy,hw,hh))return true;
 for(const b of L.rov||[])if(Math.abs(b.x-cx)<30&&Math.abs(b.y-cy)<30&&circRect(b.x,b.y,6,hx,hy,hw,hh)){b.life=0;return true}
 return false}

// ================= WORLD 6: MOON ROVERS =================
// Ground patrol (see updMovers, m.t=='rov') + an AIMED laser-bolt spawner modeled on the 'rkt' plumbing above: a per-mover
// fire timer, gated on the player being in range AND in line of sight, runs a visible wind-up and then spawns a bolt into
// L.rov along the angle it LOCKED when that wind-up began; hurt() checks the bolt like L.rk.
function roverBoom(b){for(let i=0;i<10;i++){const a=Math.random()*7,sp=rnd(40,170);G.parts.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:0.3,ml:0.3,c:['#ff3b3b','#ff8a3b','#fff2b0'][i%3],s:rnd(2,4),g:0,sh:'sq',shrink:1})}if(Math.abs(b.x-G.player.x)<VW&&Math.abs(b.y-G.player.y)<VH)sfx('crumble')}
// cheap segment-vs-solid raycast (18 samples) - enough to stop a rover shooting through a wall or a floor ledge
function w6LOS(L,x0,y0,x1,y1){const n=18;for(let i=1;i<n;i++){const u=i/n;if(solidAt(L,x0+(x1-x0)*u,y0+(y1-y0)*u))return false}return true}
const ROVR=13*TS,ROVH=6.5*TS,ROVBS=300; // acquire range / vertical acquire band / bolt speed
// FIXED - three separate bugs made the old lasers "not shoot at you":
//  1. the turret DREW itself aiming at the player, but the bolt only ever carried a horizontal vx, so every shot at a
//     player who wasn't dead level with the rover sailed under or over them. Bolts now carry vx AND vy along the aim.
//  2. an out-of-range rover parked its timer at per-0.04, so its first shot went off ~5 frames after you walked into
//     range - a hitscan ambush with no wind-up. The timer now parks at per-wind, so EVERY shot costs the full telegraph.
//  3. the bolt left 6px above the rover centre and was tested at r=5, leaving ~0.5px of overlap against a player
//     standing on the same floor - shots visibly passed through you. It now leaves the turret pivot and tests at r=6.
// New on top: rovers won't fire through solid moon rock (w6LOS), and bolts despawn on the vertical bounds too.
function updRovers(L,dt){if(!L.movers||!L.movers.length)return;const s=G.spd||1,p=G.player,pcx=p.x+p.w/2,pcy=p.y+p.h/2;
 for(const m of L.movers){if(m.t!='rov')continue;m.ft=(m.ft||0)+dt*s;
  const tx=m.x-2,ty=m.y-5,dx=pcx-tx,dy=pcy-ty,wind=m.wind||0.6;
  const inRange=!p.dead&&!G.won&&Math.abs(dy)<ROVH&&Math.abs(dx)<ROVR&&w6LOS(L,tx,ty,pcx,pcy);
  if(m.kick>0)m.kick-=dt*s;
  if(!inRange){m.aim=null;m.ft=Math.min(m.ft,m.per-wind)}
  else if(m.ft>=m.per-wind&&m.aim==null){m.aim=Math.atan2(dy,dx);m.aimT=0;sfx('tick')}
  if(m.aim!=null)m.aimT=(m.aimT||0)+dt*s;
  if(m.ft>=m.per&&m.aim!=null){const a=m.aim;m.ft=0;m.aim=null;m.kick=0.16;sfx('click');
   L.rov.push({x:tx+Math.cos(a)*13,y:ty+Math.sin(a)*13,vx:Math.cos(a)*ROVBS*(m.mul||1),vy:Math.sin(a)*ROVBS*(m.mul||1),a,life:2.6,trail:[]})}}
 for(let i=L.rov.length-1;i>=0;i--){const b=L.rov[i];b.life-=dt;b.trail.push(b.x,b.y);if(b.trail.length>10)b.trail.splice(0,b.trail.length-10);
  b.x+=b.vx*dt*s;b.y+=(b.vy||0)*dt*s;
  if(b.life<=0||solidAt(L,b.x,b.y)||b.x<0||b.y<0||b.x>L.W*TS||b.y>L.H*TS){roverBoom(b);L.rov.splice(i,1)}}}

// ================= WORLD 6: THRUSTER VENTS + GRAVITY WELLS =================
// Two Low-G-Zone-only field effects. Both are PURE FUNCTIONS OF POSITION (no timers, no internal state) so they stay
// readable at speed, replay identically, and can be solved exactly by the offline physics bot.
// Vent ['vnt',tx,ty,dir,len,pow]: a regolith gas vent venting up ('U') or down ('D') a `len`-tile column out of the mouth
//   tile (tx,ty). Inside the column the jet drives the player's vy TOWARD its own jet speed and never slows a faster
//   jump, so it reads as a lift you ride, not a teleport. Vertical-only on purpose: the run code SETS the player's
//   horizontal speed outright every frame, so a sideways jet would simply be cancelled out by holding a direction.
// Well ['wel',tx,ty,r,pow]: an orbital anomaly pulling the player radially toward its centre, strongest at the core and
//   falling off linearly to nothing at radius r tiles. Harmless to touch - it bends your arc, it does not kill you -
//   and capped well below a full jump's worth of escape speed so you can always thrust back out of one.
const VNTV=300,VNTD=250,WELA=900;
function w6Forces(L,p,dt){
 const pcx=p.x+p.w/2,pcy=p.y+p.h/2;
 if(L.vents)for(const v of L.vents){
  if(pcx<v.tx*TS-3||pcx>v.tx*TS+TS+3)continue;
  const up=v.dir!='D',y0=up?(v.ty-v.len)*TS:v.ty*TS+TS,y1=up?v.ty*TS+TS:(v.ty+1+v.len)*TS;

// Huge two-handed club swinger. The swing is a FULL arc - up on one side, down that side, across the ground and up the
// other - so he threatens BOTH sides of himself, reaching 3.7 tiles out EACH way (a 7.4-tile span, wide enough to cover
// a whole land-bridge or corridor the player has to cross). Timing is a pure function of time (deterministic,
// solver-safe, same family as the laser blink), and the hazard is sampled along the SAME club line that gets drawn, so
// the hitbox is literally the club you see. Sizes and clearances are checked by the geometry audit, not by eye.
// SIZE: 1.4x the old ogre - 123px (5.1 tiles) tall and 104px (4.3 tiles) across the shoulders, roughly double the
// screen area of the zombie he used to be barely bigger than. The club pivots at his NECK rather than his chest, which
// is what buys the extra length: the arc has to bottom out at the floor, so club radius <= pivot height + a small bite,
// and raising the pivot 11px raises the ceiling on how long the club can be. He now reaches 3.9 tiles EACH side.
const OGS=1.4;                                         // overall ogre scale - he has to read as a heavy miniboss, not a mook
const OG_PIVL=-59,OG_ARML=20,OG_TIPL=60;               // club geometry in his OWN (unscaled) drawing frame
const OG_GRIPL=31;                                     // where the FISTS sit along the haft - well clear of his face,
                                                       // which the math pivot (at his neck) is deliberately not
const OG_PIV=OG_PIVL*OGS,OG_ARM=OG_ARML*OGS,OG_TIP=OG_TIPL*OGS;  // ...and in world px, which is what ogreClub/hurt use

const OG_RMAX=Math.max(OG_R,...OG_HIT.map(q=>q[0]+q[1]));  // furthest ANYTHING about him gets from the pivot, art or hitbox
// How far along the GROUND the club sweeps: where its circle crosses knee height. Much narrower than the max reach,
// because the club peaks at chest height - this is the number the floor telegraph draws and the number that decides
// whether someone standing on the floor is safe. Local (unscaled) units: the telegraph is drawn in his own frame.

// ---------- GHOST ----------
// The one monster that ignores the level: it drifts straight THROUGH terrain, homing on the player, but it is slow
// (well under run speed - you can always just leave) and it is only solid for part of its cycle, so every ghost has a
// guaranteed safe window. It is leashed to where it spawned, so it haunts a stretch of woods, not the whole map.
// u: 0-.18 materialising (safe) | .18-.58 SOLID (hazard) | .58-.72 dissolving (safe) | .72-1 phased out (safe)
// The materialise window is the whole telegraph, so it is deliberately long: at the default per=3.4s you get 0.61s of
// "it is about to be real" - it brightens, swells to full size and pulls in a contracting dashed ring - before it can
// touch you, and it very nearly STOPS drifting for that whole window (see updGhosts) so it can never materialise onto
// you from behind. 0.61s at run speed is 150px of escape, against a 11px hitbox.
// The phased-out alpha is 0.22 rather than near-nothing on purpose: a ghost you cannot see is a ghost you cannot plan
// around. Faded, it is a visible cold smudge that happens to be harmless; lit, it is unmistakable.
function ghostPhase(m,t){const per=m.per||3.4,u=(((t/per+(m.ph||0))%1)+1)%1;

 if(u<0.58)return{u,a:0.86,solid:true,form:1};
 if(u<0.72)return{u,a:0.86-0.64*((u-0.58)/0.14),solid:false,form:1-(u-0.58)/0.14};

function updGhosts(L,dt){if(!L.movers)return;const p=G.player,s=G.spd||1,gt=G.t*s;
 for(const m of L.movers){if(m.t!='gho')continue;const st=ghostPhase(m,gt);m.sol=st.solid;
  const dh=Math.hypot(m.x-m.hx,m.y-m.hy);
  if(dh>m.lea)m.ret=1;else if(m.ret&&dh<m.lea*0.3)m.ret=0;   // leashed: it haunts its own stretch of woods
  let tx=m.hx,ty=m.hy;if(!m.ret&&p&&!p.dead){tx=p.x+8;ty=p.y+8}
  const dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy)||1;
  // SLOWER while it can hurt you (always outrunnable - RUN is 250), and it all but STOPS while materialising, so the
  // telegraph is honest: wherever the ring appears is where the thing is going to be solid. It cannot creep onto you.
  const sp=(st.form<1&&st.u<0.5?12:st.solid?44:74)*s;

  if(Math.abs(dx)>1)m.face=dx<0?-1:1}}

  // (see the c_ghost entries in SKIN_BODY/SKIN_FACE and the tail loop in drawSq) so the enemy and the skin read as the

  if(st.solid){ctx.fillStyle=`rgba(198,238,255,${(0.72+0.28*gg).toFixed(2)})`;
   ctx.beginPath();ctx.arc(-4.6+lx*1.2,-4+ly*1.3,1.7,0,7);ctx.arc(4.6+lx*1.2,-4+ly*1.3,1.7,0,7);ctx.fill();

// ---------- GILDED VALE CHEST PAYOUT ----------
// A chest does not just unlock the doors, it PAYS. Touch it and it coughs its gold up ONE COIN AT A TIME: each coin
// pops out of the lid on its own little arc, spins in the air, and is banked the moment it lands, with a running "+N"
// tally floating over the chest (see drawChestPayout). Every coin goes through addCoins(), so the Coin Doubler and the
// Hopscraper Club multiplier apply to chest gold exactly like any other coin - the tally shows what was really banked,
// so a doubled chest visibly counts +2, +4, +6.
// BALANCE: the free coin economy is ~2.4k lifetime against a ~2.39k coin shop, so a chest has to feel generous without
// becoming the economy. CHEST_PAY is a FIRST-CLEAR payout (14 chests across Gilded Vale = ~140 coins once, ~6% of the
// lifetime total); every replay of a level you have already cleared pays CHEST_PAY_REPLAY instead, so re-running a
// short gold level is never a coin farm. Unlike the vault flag, the payout is per-OPEN: an opened chest stays open
// through a death (it can never soft-lock a run), and because it stays open it also never pays twice in one run.
const CHEST_PAY=10,CHEST_PAY_REPLAY=4;
function chestPay(){const rec=S.lv[G.idx];return(G.mode=='story'&&!(rec&&rec.done))?CHEST_PAY:CHEST_PAY_REPLAY}
// ---- GEMS IN THE GOLD CHESTS: the Gold Supporter Pack's headline perk (see PRODUCTS pack_gold).
// After the coins, a chest coughs up a few GEMS too - a random handful per chest, not a fixed drip, so opening one
// always has a small "what did I get" moment.
// BALANCE, and why these numbers. A gem is worth roughly a cent ($0.99 = 80 gems), and the things gems buy cost 25-45
// (a shop cosmetic) or 100 (a Premium Wheel spin). Gilded Vale holds 14 chests.
//   first clear  4-8 gems  -> ~84 gems across the whole world, about one 80-gem pack: a real, felt welcome gift
//   replay       1-2 gems  -> ~21 gems for a full 8-level sweep of a world you have already cleared
// The replay rate is the one that has to hold the line, and it does: matching the 1,600-gem tier by replaying would
// take ~76 complete runs of the world. That is far too slow to ever be the sane way to get gems, while still paying a
// supporter something every single time they go back to the world they bought. First-clear is the generous number
// precisely because it can only happen once.
// Gated on owning the world (or dev): Gilded Vale is pack-locked anyway, so this only ever matters for dev mode.
const CHEST_GEM=[4,8],CHEST_GEM_REPLAY=[1,2];
function chestGems(){if(!S.goldworld&&!S.dev)return 0;const rec=S.lv[G.idx],r=(G.mode=='story'&&!(rec&&rec.done))?CHEST_GEM:CHEST_GEM_REPLAY;
 return r[0]+Math.floor(Math.random()*(r[1]-r[0]+1))}
function updChests(L,dt){if(!L.chests||!L.chests.length)return;let done=false;const gs=G.gs||1;

  ch.openT=(ch.openT||0)+dt;if(ch.cntT>0)ch.cntT-=dt;if(ch.gcntT>0)ch.gcntT-=dt;
  if(ch.pay>0){ch.emit-=dt;                                   // one coin every ~0.11s: a stream, not a burst
   if(ch.emit<=0){ch.emit=0.11;ch.pay--;
    (ch.fly=ch.fly||[]).push({x:ch.x+rnd(-3,3),y:ch.y-7,vx:(ch.pay%2?-1:1)*rnd(45,115),vy:rnd(-250,-185)*gs,r:rnd(0,6.28),rv:rnd(-10,10),l:rnd(0.5,0.68)});
    sfx('coin')}}
  // gems come AFTER the coin stream and fly slower and higher, so the two payouts never blur into one gold smear
  else if(ch.gpay>0){ch.emit-=dt;
   if(ch.emit<=0){ch.emit=0.17;ch.gpay--;
    (ch.fly=ch.fly||[]).push({x:ch.x+rnd(-3,3),y:ch.y-8,vx:(ch.gpay%2?-1:1)*rnd(30,80),vy:rnd(-285,-225)*gs,r:0,rv:0,l:rnd(0.6,0.76),gem:1});
    sfx('gem')}}
  if(ch.fly)for(let i=ch.fly.length-1;i>=0;i--){const f=ch.fly[i];f.l-=dt;f.vy+=980*dt*gs;f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.rv*dt;

    if(f.gem){S.bank++;S.earned++;ch.gcnt=(ch.gcnt||0)+1;ch.gcntT=0.24;burst(f.x,f.y,'#5ff4ff',5)}
    else{ch.cnt=(ch.cnt||0)+addCoins(1);ch.cntT=0.24;burst(f.x,f.y,'#ffd45e',5)}
    if(ch.pay<=0&&ch.gpay<=0&&!ch.fly.length)done=true}}}

function step(dt){const L=G.L,p=G.player;G.t+=dt;

 case'conf':ctx.translate(x,y);ctx.rotate((q.r||0)+(q.vr||0)*age*0.25);ctx.scale(Math.cos(age*(q.vr||0)),1);ctx.fillRect(-s/2,-s*0.3,s,s*0.6);break;
 case'snow':{ctx.translate(x,y);ctx.rotate((q.r||0)+(q.vr||0)*age);ctx.lineWidth=Math.max(1,s*0.24);ctx.lineCap='round';ctx.beginPath();
  for(let i=0;i<6;i++){const a=i*Math.PI/3,c=Math.cos(a),n=Math.sin(a);ctx.moveTo(0,0);ctx.lineTo(c*s,n*s);
   if(s>=3.5){const bx=c*s*0.58,by=n*s*0.58,k=s*0.3;ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a+0.8)*k,by+Math.sin(a+0.8)*k);ctx.moveTo(bx,by);ctx.lineTo(bx+Math.cos(a-0.8)*k,by+Math.sin(a-0.8)*k)}}
  ctx.stroke();break}
 case'leaf':{const w=Math.sin(age*(q.sw||0));ctx.translate(x+w*4,y);ctx.rotate((q.r||0)+w*0.8);ctx.beginPath();ctx.moveTo(-s,0);ctx.quadraticCurveTo(0,-s*0.8,s,0);ctx.quadraticCurveTo(0,s*0.8,-s,0);ctx.fill();
  ctx.strokeStyle='rgba(60,30,10,.35)';ctx.lineWidth=Math.max(0.7,s*0.14);ctx.beginPath();ctx.moveTo(-s*1.25,0);ctx.lineTo(s*0.7,0);ctx.stroke();break}
 case'note':{ctx.translate(x+Math.sin(age*(q.sw||0))*3,y);const r=s*0.45,sx=r*0.78,top=-s*1.6,lw=Math.max(1,s*0.2);ctx.beginPath();ctx.ellipse(0,0,r,r*0.72,-0.45,0,7);ctx.fill();
  ctx.fillRect(sx-lw/2,top,lw,-top);ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sx,top);ctx.quadraticCurveTo(sx+s*0.2,top+s*0.5,sx+s*0.7,top+s*0.75);ctx.stroke();break}
 case'bolt':{ctx.translate(x,y);ctx.rotate(q.r||0);ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-s*0.15,-s);ctx.lineTo(s*0.3,-s*0.15);ctx.lineTo(-s*0.3,s*0.1);ctx.lineTo(s*0.15,s);
  const a=ctx.globalAlpha;ctx.globalAlpha=a*0.4;ctx.lineWidth=Math.max(2,s*0.5);ctx.stroke();ctx.globalAlpha=a;ctx.lineWidth=Math.max(1,s*0.16);ctx.strokeStyle='#ffffff';ctx.stroke();break}
 case'ghost':{ctx.translate(x+Math.sin(age*(q.sw||0))*3,y);const r=s;ctx.globalAlpha*=0.9;ctx.beginPath();ctx.arc(0,-r*0.15,r,Math.PI,0);ctx.lineTo(r,r*0.75);
  for(let i=0;i<3;i++){const x0=r-i*(2*r/3);ctx.quadraticCurveTo(x0-r/3,r*(i%2?0.45:1.1),x0-2*r/3,r*0.75)}ctx.closePath();ctx.fill();
  ctx.fillStyle='#2a2440';ctx.beginPath();ctx.arc(-r*0.36,-r*0.2,r*0.17,0,7);ctx.moveTo(r*0.53,-r*0.2);ctx.arc(r*0.36,-r*0.2,r*0.17,0,7);ctx.fill();break}
 // ---- shapes for the Premium Wheel trails: extra glow/facets so they read as rarer than a normal shop trail ----
 case'glow':{ctx.translate(x,y);const a=ctx.globalAlpha;ctx.globalAlpha=a*0.35;ctx.beginPath();ctx.arc(0,0,s*1.8,0,7);ctx.fill();
  ctx.globalAlpha=a;ctx.beginPath();ctx.arc(0,0,s*0.55,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.globalAlpha=a*0.85;ctx.beginPath();ctx.arc(-s*0.15,-s*0.15,s*0.22,0,7);ctx.fill();break}
 case'shard':{ctx.translate(x,y);ctx.rotate((q.r||0)+(q.vr||0)*age);ctx.beginPath();ctx.moveTo(0,-s*1.6);ctx.lineTo(s*0.45,0);ctx.lineTo(0,s*1.6);ctx.lineTo(-s*0.45,0);ctx.closePath();ctx.fill();
  const a=ctx.globalAlpha;ctx.globalAlpha=a*0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-s*1.1);ctx.lineTo(s*0.18,0);ctx.lineTo(0,s*0.3);ctx.lineTo(-s*0.18,0);ctx.closePath();ctx.fill();break}

  const a=ctx.globalAlpha;ctx.globalAlpha=a*0.7;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*0.35,0,7);ctx.fill();break}}
 ctx.restore()}

function updParts(arr,dt){for(let i=arr.length-1;i>=0;i--){const q=arr[i];q.l-=dt;if(q.l<=0){arr.splice(i,1);continue}q.vy+=(q.g||0)*dt;if(q.drag){q.vx*=1-q.drag*dt;q.vy*=1-q.drag*dt}q.x+=q.vx*dt;q.y+=q.vy*dt}if(arr.length>700)arr.splice(0,arr.length-700)}
function drawParts(arr,cull){for(const q of arr){if(cull&&(q.x<cull[0]||q.x>cull[2]||q.y<cull[1]||q.y>cull[3]))continue;const a=clamp(q.l/(q.ml||1),0,1);ctx.globalAlpha=a;const s=q.shrink?q.s*a:q.s;ctx.fillStyle=q.c;ctx.strokeStyle=q.c;

  case'sp':ctx.fillRect(q.x-s,q.y-0.8,s*2,1.6);ctx.fillRect(q.x-0.8,q.y-s,1.6,s*2);break;case'star':star5(q.x,q.y,s,q.c);break;
  case'heart':heart(q.x,q.y,s,q.c);break;case'conf':case'snow':case'leaf':case'note':case'bolt':case'ghost':case'glow':case'shard':case'spark2':trShape(q,q.x,q.y,s,q.ml-q.l);break;default:ctx.fillRect(q.x-s/2,q.y-s/2,s,s)}}ctx.globalAlpha=1}
function updCam(dt,snap){const L=G.L,p=G.player;const lw=L.W*TS,lh=L.H*TS;
 const want=clamp(p.vx/RUN,-1,1)*26;G.look=snap?want:lerp(G.look||0,want,1-Math.pow(0.02,dt));
 const wantY=clamp(p.vy/MAXF,-0.6,1)*45;G.lookY=snap?wantY:lerp(G.lookY||0,wantY,1-Math.pow(0.05,dt));
 const ia=clamp(G.acc/DT,0,1),ix=p.px!=null?lerp(p.px,p.x,ia):p.x,iy=p.py!=null?lerp(p.py,p.y,ia):p.y; // interpolated, matches drawWorld
 let tx=ix+8-VW/2+G.look,ty=iy+8-VH/2+G.lookY;
 // headroom above the level top when the exit sits near it (e.g. THE TOP), so the door isn't hidden under the HUD
 const hr=(L.exit&&L.exit.y>0&&L.exit.y<6)?72:0;
 tx=lw<=VW?(lw-VW)/2:clamp(tx,0,lw-VW);ty=lh<=VH?(lh-VH)/2:clamp(ty,-hr,lh-VH);
 if(snap){G.cam.x=tx;G.cam.y=ty}else{const k=1-Math.pow(0.0015,dt);G.cam.x+=(tx-G.cam.x)*k;G.cam.y+=(ty-G.cam.y)*k}}

function starsOf(i){const r=S.lv[i];if(!r||!r.done)return[0,0,0];const d=LEVELS[i];return[1,d.g.every((_,k)=>r.g&&r.g[k])?1:0,r.t&&r.t<=d.t?1:0]}
// Star count shown to the player = the FREE story only (STORY_ORDER = Worlds 1-5 + THE TOP), so 100% is reachable
// without buying anything. Paid bonus-world stars are counted separately by bonusStars() and shown as a "+N bonus" extra.
function totalStars(){let n=0;for(const i of STORY_ORDER)n+=starsOf(i).reduce((a,b)=>a+b,0);return n}
function bonusStars(){let n=0;for(let i=0;i<LEVELS.length;i++){const d=LEVELS[i];if(!d||STORY_ORDER.includes(i))continue;
  const b=BONUS_WORLDS.find(x=>x.wd==d.wd);if(b&&(S[b.flag]||S.dev))n+=starsOf(i).reduce((a,b)=>a+b,0)}return n}
// "Story N%" progress: free story stars only, same denominator as the star count above.
function storyPct(){return Math.floor(totalStars()/STAR_MAX*100)}
function unlocked(i,mode){if(S.dev)return true;if(mode=='hard')return !!S.finale&&(i==0||!!(S.hard[i-1]&&S.hard[i-1].done));
 // World 6 (Low-G Zone) is optional PAID bonus content: it is NOT in STORY_ORDER, so prevOf() would return -1 for it and the
 // generic "no previous level = unlocked" rule below would wrongly always unlock it. Gate it on the purchase flag instead,
 // with simple in-world sequential progression once purchased (mirrors hard mode's own i-1 chain above).
 const d=LEVELS[i];if(d&&d.wd==6)return !!S.world6&&(i==NL+NB||!!(S.lv[i-1]&&S.lv[i-1].done));
 // World 7 (Gilded Vale): same PAID-bonus gating pattern as World 6 above, own flag. Start index looked up dynamically
 // (not a hardcoded literal) since other bonus worlds may be appended before/after it.
 if(d&&d.wd==7)return !!S.goldworld&&(i==LEVELS.findIndex(l=>l.wd==7)||!!(S.lv[i-1]&&S.lv[i-1].done));
 // World 8 (Monster Woods): same PAID-bonus gating pattern as World 6 above, just its own flag. Its start index is looked
 // up dynamically (not a hardcoded literal like World 6's) since other bonus worlds may be appended between them.
 if(d&&d.wd==8)return !!S.monsterworld&&(i==LEVELS.findIndex(l=>l.wd==8)||!!(S.lv[i-1]&&S.lv[i-1].done));
 const pv=prevOf(i);return i==0||pv<0||!!(S.lv[pv]&&S.lv[pv].done)}
function worldDone(w){return !!S.dev||!!(S.lv[w*8+7]&&S.lv[w*8+7].done)}
function grant(id){if(S.ach[id])return;S.ach[id]=1;S.tix++;const a=ACH.find(a=>a.id==id);const its=ITEMS.filter(it=>it.ach==id);its.forEach(it=>S.own[it.id]=1);
 toast(a.n+'  +1 ticket',its.length?'Unlocked: '+its.map(i=>i.n).join(', '):a.d,'ach');sfx('ach');save()}
function checkAch(){if(S.st.jumps>=500)grant('fly500');if(S.st.jumps>=5000)grant('fly5k');if(S.st.deaths>=100)grant('die100');if(S.st.deaths>=500)grant('die500');
 if(S.earned>=50)grant('gem50');if(S.earned>=150)grant('gem150');
 // Perfectionist = every star in the STORY (Worlds 1-5 + THE TOP) - paid bonus worlds are never required for a trophy
 let par=0,all=true;for(let i=0;i<LEVELS.length;i++){const s=starsOf(i);if(s[2])par++;if(STORY_ORDER.includes(i)&&!(s[0]&&s[1]&&s[2]))all=false}if(par>=10)grant('speedy');if(all)grant('perfect');
 // Star Student: any full 8-level world counts - Worlds 1-4, World 5 (Rocket Yard) and every bonus world you own
 for(const a of[0,8,16,24,NL].concat(BONUS_WORLDS.filter(b=>S[b.flag]||S.dev).map(b=>LEVELS.findIndex(l=>l.wd==b.wd)).filter(x=>x>=0))){let ok=true;for(let i=a;i<a+8&&i<LEVELS.length;i++){const s=starsOf(i);if(!(s[0]&&s[1]&&s[2]))ok=false}if(ok)grant('allw')}
 let h=true;for(let i=0;i<NL;i++)if(!(S.hard[i]&&S.hard[i].done))h=false;if(h)grant('nightmare')}
function levelWon(){const i=G.idx,def=LEVELS[i];
 const res={i,mode:G.mode,time:G.time,deaths:G.deaths,jumps:G.jumps,par:def.t,gems:G.L.gems.map(g=>g.got),gt:def.g.length,newGems:0,stars:[1,0,0],newStars:[0,0,0],bestT:false,first:false,worldClear:-1,finaleFirst:false,bonus:0,reward:null};
 S.st.clears++;
 if(G.mode=='story'){const rec=S.lv[i]||(S.lv[i]={done:0,g:[],t:0,fl:0});const old=starsOf(i);res.first=!rec.done;
  G.L.gems.forEach(gm=>{if(gm.got&&!rec.g[gm.i]){rec.g[gm.i]=1;res.newGems++}});
  res.usedCard=!!G.usedCard;if(!res.usedCard&&(!rec.t||G.time<rec.t)){res.bestT=!!rec.t;rec.t=G.time} // Power Card runs: clear + gems count, time/par/flawless/leaderboard don't
  if(G.deaths==0&&!res.usedCard){rec.fl=1;grant('flaw')}
  rec.done=1;const now=starsOf(i);res.stars=now;res.newStars=now.map((s,k)=>s&&!old[k]?1:0);
  res.bonus=(res.newStars[1]+res.newStars[2])*2;S.bank+=res.newGems+res.bonus;S.earned+=res.newGems+res.bonus;
  if(i==0)grant('first');
  if(res.first&&i==NL+NB-1)grant('rocket');
  if(res.first&&i<NL-1&&i%8==7){res.worldClear=Math.floor(i/8);grant('w'+(res.worldClear+1));const it=WREW[res.worldClear];if(!S.own[it]){S.own[it]=1;res.reward=it}}
  if(i==NL-1&&!S.finale){res.finaleFirst=true;S.finale=1;grant('top');}
  if(!res.usedCard&&(res.bestT||res.first)){const w=i>=NL?4:i<NL-1?Math.floor(i/8):-1,wt=worldTime(w);if(wt)submitScore('world'+(w+1),wt)}submitScore('stars',totalStars())}
 else if(G.mode=='hard'){const rec=S.hard[i]||(S.hard[i]={done:0,t:0});res.first=!rec.done;if(!rec.t||G.time<rec.t){res.bestT=!!rec.t;rec.t=G.time}
  if(res.first){S.bank+=3;S.earned+=3;res.bonus=3}rec.done=1;if(i==NL-1)grant('hard')}
 // coins: pickups + clear reward + par + no falls
 const hardM=G.mode=='hard';res.coinPick=G.coinsRun;res.coinClear=hardM?(res.first?25:5):(res.first?10:5);res.coinPar=G.time<=def.t?5:0;res.coinFlaw=G.deaths==0?5:0;
 res.coins=addCoins(res.coinPick+res.coinClear+res.coinPar+res.coinFlaw);
 checkAch();save();return res}
// total best time for a world (only when every level in it has a time)
function worldTime(w){if(w<0)return 0;const a=w<4?w*8:NL;let s=0;for(let i=a;i<a+8;i++){const r=S.lv[i];if(!r||!r.t)return 0;s+=r.t}return s}
function endEndless(){go('over',saveEndless())}
// banks + records an Endless/Daily run (gems, coins, bests, daily ticket). Used by endEndless and by R-restart.
// DAILY CLIMB anti-farm: the daily tower is seeded, so its gems sit in the SAME spots every attempt - memorise the
// route and you could re-run it forever for gems. So a day's tower only ever pays for gems you have not already been
// paid for today: S.daily.gp is the high-water mark of gems banked off this day's tower (gems are collected bottom-up,
// so a deeper run is a superset of a shallower one). Replaying for practice or for a better height stays free.
function saveEndless(){if(G.endSaved)return G.endSaved;const dly=G.mode=='daily',dd=dly?(G.dailyDay||todayStr()):'';
 if(dly&&S.daily.d!=dd)S.daily={d:dd,h:0,gp:0};
 const raw=G.gemsRun,pay=dly?Math.max(0,raw-(S.daily.gp||0)):raw;
 const r=G.endSaved={h:G.height,gems:pay,gemsRaw:raw,daily:dly,best:false};S.bank+=pay;S.earned+=pay;r.coins=addCoins(Math.floor(r.h/5));
 if(r.daily){const d=dd;S.daily.gp=Math.max(S.daily.gp||0,raw);r.rollover=d!=todayStr();if(r.h>S.daily.h){S.daily.h=r.h;r.best=true}r.bestV=S.daily.h;if(dayNum(d)>dayNum(S.dtix)){S.dtix=dayNum(d);S.tix++;r.tix=1}submitScore('daily',S.daily.h)}
 else{if(r.h>S.endBest){S.endBest=r.h;r.best=true}r.bestV=S.endBest;submitScore('endless',S.endBest)}
 if(r.h>=100)grant('climb');if(r.h>=250)grant('mountain');checkAch();save();return r}
function onWinDone(){
 // Straight into 1-1 the first time: MODES is almost entirely locked this early and reads as a wall of padlocks.
 // A refresher replay (S.tut already set) goes back to the story level select instead of restarting the game for you.
 if(G.mode=='tut'){const first=!S.tut;S.tut=1;if(first){S.bank+=5;S.earned+=5}save();toast('Tutorial complete!',first?'+5 gems. Here we go - level 1-1.':'Nice refresher.','ach');return first?startLevel(0,'story'):go('levels')}
 if(G.mode=='course'){const i=G.idx,rec=S.course[i]||(S.course[i]={t:0});const r={i,t:G.time,deaths:G.deaths,best:false,gems:G.gemsRun};
  if(!rec.t||G.time<rec.t){rec.t=G.time;r.best=true;submitScore('course'+i,rec.t)}
  S.bank+=G.gemsRun;S.earned+=G.gemsRun;r.medal=medalOf(i,rec.t);
  // medal coins: bronze 10 / silver 20 / gold 30, each tier paid once
  const had=S.coinMed[i]==null?-1:S.coinMed[i];let mc=0;for(let m=had+1;m<=r.medal;m++)mc+=[10,20,30][m];if(r.medal>had)S.coinMed[i]=r.medal;r.coins=addCoins(mc);
  S.st.clears++;checkAch();save();return go('cdone',r)}
 if(G.mode=='speed'||G.mode=='hspeed'){const hs=G.mode=='hspeed';SPD.total+=G.time;SPD.deaths+=G.deaths;SPD.coins=(SPD.coins||0)+addCoins(G.coinsRun);save();const n=hs?(G.idx+1<NL?G.idx+1:-1):nextOf(G.idx);if(n>=0)return startLevel(n,G.mode);
  const r={t:SPD.total,d:SPD.deaths,best:false,hard:hs,coins:SPD.coins||0};
  if(hs){if(!S.hspeedBest||r.t<S.hspeedBest){S.hspeedBest=r.t;r.best=true}submitScore('hmarathon',S.hspeedBest);grant('ironman')}
  else{if(!S.speedBest||r.t<S.speedBest){S.speedBest=r.t;r.best=true}submitScore('marathon',S.speedBest);if(r.t<720)grant('demon')}
  S.st.clears++;save();return go('sdone',r)}
 // through addCoins(), not S.coins+=, so the Coin Doubler and the Club's 2x actually apply to a chaos clear
 if(G.mode=='chaos'){addCoins(5);save();return go('chaosdone',{i:G.idx,time:G.time,deaths:G.deaths,mod:[...(G.mods||[])][0]||null})}
 go('clear',levelWon())}

const FONT='"Trebuchet MS","Segoe UI",Verdana,sans-serif';
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,size,col,align,sh){ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(sh!==false){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillText(s,x+2,y+3)}ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function star5(x,y,r,fill,stroke,lw){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||3;ctx.stroke()}}

 update(dt){
  // A note never pauses the level and never consumes an input. Any fresh key, click or finger makes it go away, and
  // that same input still moves/jumps as normal (touchstart clears it directly - see the TOUCH section).
  // NEWKEY, not ANY: a direction key the player was ALREADY holding when they walked into the note must not count.
  if(G.noteShow&&gtime-G.noteShow.t0>NOTE_GRACE&&(pressed.NEWKEY||mouse.click))G.noteShow=null;
  if(pressed.ESC&&!G.won){go('pause');return}if(pressed.RST&&!G.won){restartLevel();return}
  if(mouse.click&&!G.won&&Math.hypot(mouse.x-RB.x,mouse.y-RB.y)<RB.r*1.7){mouse.click=false;restartLevel();return}
  if(mouse.click&&!G.won&&cardPillHit(mouse.x,mouse.y)){mouse.click=false;go('cards',{from:'play'});return}
  // Power Cards: countdown + keyboard activation (digit keys 1-5 = shield/slowmo/xjump/magnet/goldrush). Story Mode only — cardsAllowed()/useCard() re-check G.mode themselves.
  if(G.mode=='story'&&G.cardActive){G.cardT-=dt;if(G.cardT<=0){if(G.cardActive=='goldrush'&&G.L)G.L.grCoins=[];G.cardActive=null;G.cardT=0}}
  // digit presses are ignored while a movement/jump key is held (fat-fingering 1-4 mid-run shouldn't burn a card)
  if(G.mode=='story'&&typedDigit!=null){const idx=+typedDigit-1;typedDigit=null;if(!(keys.L||keys.R||keys.U||keys.D||keys.J)&&idx>=0&&idx<CARD_TYPES.length)useCard(CARD_TYPES[idx])}
  const p=G.player;if(p&&!p.dead&&(pressed.J||pressed.U))p.buf=0.13;
  G.acc+=dt*cardTimeMul();let n=0;while(G.acc>=DT&&n<12){step(DT);G.acc-=DT;n++;if(SCR!==SCREENS.play)return}
  ambient(dt);updParts(G.parts,dt);if(G.player)updCam(dt);if(G.intro>0)G.intro-=dt;if(G.tipT>0&&G.intro<=0)G.tipT-=dt;G.shake*=Math.pow(0.0005,dt);
  if(G.won){G.winT+=dt;if(G.winT>1.0&&!G.winDone){G.winDone=1;onWinDone();return}}
  if(Math.floor(G.t)!=Math.floor(G.t-dt))checkAch()},

// ================= SHOP TAXONOMY =================
// The shop was reorganised alongside the store collapse (see the note above PRODUCTS). Two rules drive everything below:
//
//  1. GROUP BY WHAT A THING IS. Top tabs are Skins / Hats / Trails / Packs / Gems - five kinds of thing, no "Store"
//     drawer with a different kind of content hiding inside it.
